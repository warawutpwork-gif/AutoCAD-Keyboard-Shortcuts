<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoCAD Key Guide — คีย์ลัดครบทุกคำสั่ง</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --bg2: #161b27;
    --bg3: #1e2535;
    --surface: #232c3d;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e8eaf0;
    --muted: #7a8299;
    --dim: #4a5368;

    --draw: #3b82f6;
    --draw-bg: rgba(59,130,246,0.12);
    --modify: #ef4444;
    --modify-bg: rgba(239,68,68,0.12);
    --view: #22c55e;
    --view-bg: rgba(34,197,94,0.12);
    --dim-c: #f59e0b;
    --dim-bg: rgba(245,158,11,0.12);
    --layer: #a855f7;
    --layer-bg: rgba(168,85,247,0.12);
    --select: #06b6d4;
    --select-bg: rgba(6,182,212,0.12);
    --file: #ec4899;
    --file-bg: rgba(236,72,153,0.12);
    --3d: #10b981;
    --3d-bg: rgba(16,185,129,0.12);
    --inquiry: #f97316;
    --inquiry-bg: rgba(249,115,22,0.12);
    --block: #8b5cf6;
    --block-bg: rgba(139,92,246,0.12);
    --layout: #14b8a6;
    --layout-bg: rgba(20,184,166,0.12);
    --advanced: #fb7185;
    --advanced-bg: rgba(251,113,133,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sarabun', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }

  /* Header */
  .header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--draw); }

  .search-wrap {
    flex: 1;
    max-width: 380px;
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    opacity: 0.4;
    pointer-events: none;
  }
  .search-wrap input {
    width: 100%;
    padding: 9px 12px 9px 36px;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Sarabun', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  .search-wrap input:focus { border-color: var(--draw); }
  .search-wrap input::placeholder { color: var(--dim); }

  .count-badge {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    margin-left: auto;
  }

  /* Sidebar */
  .layout {
    display: flex;
    min-height: calc(100vh - 57px);
  }

  .sidebar {
    width: 200px;
    flex-shrink: 0;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    padding: 14px 10px;
    position: sticky;
    top: 57px;
    height: calc(100vh - 57px);
    overflow-y: auto;
  }

  .sidebar-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--dim);
    padding: 0 8px;
    margin-bottom: 8px;
    margin-top: 12px;
  }
  .sidebar-label:first-child { margin-top: 0; }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 7px 10px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'Sarabun', sans-serif;
    font-size: 13.5px;
    cursor: pointer;
    transition: all .15s;
    text-align: left;
  }
  .nav-btn:hover { background: var(--bg3); color: var(--text); }
  .nav-btn.active { background: var(--surface); color: var(--text); }

  .nav-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .nav-count {
    margin-left: auto;
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    opacity: 0.5;
  }

  /* Main */
  .main {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
    min-width: 0;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .section-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }
  .section-badge {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    border: 1px solid;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 8px;
    margin-bottom: 32px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    transition: border-color .15s, transform .1s;
    cursor: default;
  }
  .card:hover {
    border-color: var(--border2);
    transform: translateY(-1px);
  }

  .card-icon {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .card-body { flex: 1; min-width: 0; }

  .key {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    border: 1px solid;
    margin-bottom: 4px;
    letter-spacing: .3px;
  }

  .cmd-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cmd-desc {
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.4;
  }

  .no-result {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
  }
  .no-result .nr-icon { font-size: 3rem; margin-bottom: 12px; }
  .no-result p { font-size: 14px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  @media (max-width: 680px) {
    .sidebar { display: none; }
    .header { flex-wrap: wrap; }
    .cards-grid { grid-template-columns: 1fr 1fr; }
    .logo { font-size: 13px; }
  }
  @media (max-width: 420px) {
    .cards-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="logo">AUTO<span>CAD</span> KEY</div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search" placeholder="ค้นหาคำสั่ง เช่น line, copy..." oninput="render()">
  </div>
  <div class="count-badge" id="count-badge">— / — คำสั่ง</div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>

let activeCat = 'all';

function getCatColor(catId) {
  const c = cats.find(c => c.id === catId);
  return c ? c.color : '#7a8299';
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  const countByCat = {};
  cmds.forEach(c => { countByCat[c.cat] = (countByCat[c.cat]||0)+1; });

  sidebar.innerHTML = `<div class="sidebar-label">หมวดหมู่</div>` +
    cats.map(c => {
      const count = c.id === 'all' ? cmds.length : (countByCat[c.id]||0);
      return `<button class="nav-btn${activeCat===c.id?' active':''}" onclick="setTab('${c.id}')">
        <span class="nav-dot" style="background:${c.color}"></span>
        ${c.label}
        <span class="nav-count">${count}</span>
      </button>`;
    }).join('');
}

function setTab(id) { activeCat = id; render(); }

function render() {
  renderSidebar();
  const q = document.getElementById('search').value.toLowerCase().trim();

  let filtered = cmds.filter(c => {
    const matchCat = activeCat === 'all' || c.cat === activeCat;
    const matchQ = !q || c.key.toLowerCase().includes(q) || c.name.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q);
    return matchCat && matchQ;
  });

  document.getElementById('count-badge').textContent = `${filtered.length} / ${cmds.length} คำสั่ง`;

  const main = document.getElementById('main');
  if (!filtered.length) {
    main.innerHTML = `<div class="no-result"><div class="nr-icon">🔍</div><p>ไม่พบคำสั่ง "<strong>${q}</strong>"<br>ลองค้นหาคำอื่น</p></div>`;
    return;
  }

  const grouped = {};
  filtered.forEach(c => { if(!grouped[c.cat]) grouped[c.cat]=[]; grouped[c.cat].push(c); });

  const catOrder = ['draw','modify','view','dimension','layer','select','file','3d','inquiry','block','layout','advanced'];
  let html = '';
  for (const catId of catOrder) {
    if (!grouped[catId]) continue;
    const catObj = cats.find(c => c.id === catId);
    const color = catObj ? catObj.color : '#7a8299';
    const label = catObj ? catObj.label : catId;

    if (activeCat === 'all') {
      html += `<div class="section-header">
        <div style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0"></div>
        <span class="section-title">${label}</span>
        <span class="section-badge" style="color:${color};border-color:${color}33">${grouped[catId].length} คำสั่ง</span>
      </div>`;
    }

    html += `<div class="cards-grid">`;
    grouped[catId].forEach(c => {
      const col = getCatColor(c.cat);
      html += `<div class="card">
        <div class="card-icon" style="background:${col}18">${c.icon}</div>
        <div class="card-body">
          <span class="key" style="color:${col};border-color:${col}44;background:${col}12">${c.key}</span>
          <div class="cmd-name">${c.name}</div>
          <div class="cmd-desc">${c.desc}</div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  main.innerHTML = html;
}

render();
</script>
